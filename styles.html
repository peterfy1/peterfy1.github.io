<style>
  :root {
    --bg-page: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-subtle: #f1f5f9;
    
    --border-color: #e2e8f0;
    --border-hover: #cbd5e1;
    
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    
    --accent-dark: #0f172a;
    --accent-blue: #2563eb;
    --accent-emerald: #10b981;
    
    --radius-xs: 6px;
    --radius-sm: 12px;
    --radius-md: 20px;
    --radius-lg: 28px;
    --radius-pill: 9999px;
    
    --shadow-card: 0 2px 8px -2px rgba(15, 23, 42, 0.06), 0 1px 4px -1px rgba(15, 23, 42, 0.04);
    --shadow-hover: 0 16px 32px -8px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    --shadow-header: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
    --shadow-modal: 0 25px 60px -15px rgba(0, 0, 0, 0.35);
    
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", Menlo, monospace;
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ================= PROFILE COVER BANNER ================= */
  .profile-banner {
    width: 100%;
    height: 230px;
    background-color: #ffffff;
    background-image: url('assets/cover.png');
    background-size: cover;
    background-position: center center;
    position: relative;
    border-bottom: 1px solid var(--border-color);
  }

  .profile-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.8;
  }

  .profile-banner.has-cover::after {
    display: none;
  }

  /* ================= FLOATING PROFILE CARD ================= */
  .profile-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px;
    position: relative;
    z-index: 10;
  }

  .profile-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-top: -64px;
    padding: 28px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-header);
    gap: 28px;
    flex-wrap: wrap;
    animation: fadeUpEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUpEntrance {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .profile-identity {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  /* Squircle Avatar */
  .avatar-box {
    width: 104px;
    height: 104px;
    border-radius: 26px;
    background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
    border: 4px solid var(--bg-surface);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  .avatar-monogram {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
    user-select: none;
  }

  .profile-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .profile-title-line {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .profile-name {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .badge-verified {
    color: var(--accent-blue);
    display: flex;
    align-items: center;
  }

  .badge-available {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius-pill);
    font-size: 0.74rem;
    font-weight: 700;
    color: #166534;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .dot-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6);
    animation: pulseGlow 2s infinite;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }

  .profile-tagline {
    font-size: 1.02rem;
    color: var(--text-secondary);
    max-width: 640px;
    line-height: 1.45;
  }

  .profile-meta-tags {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .meta-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .meta-tag svg {
    color: var(--text-muted);
  }

  /* Profile Actions */
  .profile-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 22px;
    min-height: 42px;
    border-radius: var(--radius-pill);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
    border: 1px solid transparent;
    user-select: none;
    white-space: nowrap;
  }

  .btn-action:active {
    transform: scale(0.97);
  }

  .btn-action-dark {
    background: var(--accent-dark);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
  }

  .btn-action-dark:hover {
    background: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
    color: #ffffff;
  }

  .btn-action-outline {
    background: #ffffff;
    color: var(--text-primary);
    border-color: var(--border-color);
  }

  .btn-action-outline:hover {
    background: var(--bg-subtle);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
  }

  .btn-action-circle {
    width: 42px;
    height: 42px;
    min-width: 42px;
    min-height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-action-circle:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
  }

  .btn-action-circle:active {
    transform: scale(0.95);
  }

  .btn-action-circle.syncing svg {
    animation: rotateSync 1s linear infinite;
  }

  @keyframes rotateSync {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ================= GALLERY MAIN SECTION ================= */
  .gallery-container {
    max-width: 1400px;
    margin: 36px auto 80px auto;
    padding: 0 32px;
    width: 100%;
  }

  /* ================= BEHANCE-STYLE NAV TABS & TOOLS ================= */
  .gallery-nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 16px;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 26px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-tabs::-webkit-scrollbar {
    display: none;
  }

  .nav-tab-item {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    position: relative;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-tab-item:hover {
    color: var(--text-primary);
  }

  .nav-tab-item.active {
    color: var(--text-primary);
  }

  .nav-tab-item.active::after {
    content: '';
    position: absolute;
    bottom: -17px;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-dark);
    border-radius: 3px;
  }

  .tab-badge {
    background: var(--bg-subtle);
    color: var(--text-muted);
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: var(--radius-pill);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1;
    transition: var(--transition);
  }

  .nav-tab-item.active .tab-badge {
    background: #e2e8f0;
    color: var(--text-primary);
  }

  .gallery-tools {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box-wrap {
    position: relative;
    min-width: 230px;
  }

  .search-box-wrap input {
    width: 100%;
    padding: 8px 14px 8px 36px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-primary);
    font-size: 0.84rem;
    outline: none;
    transition: var(--transition);
  }

  .search-box-wrap input:focus {
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
  }

  .search-ico {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
  }

  .sort-picker {
    padding: 8px 16px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    font-size: 0.84rem;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    transition: var(--transition);
  }

  .sort-picker:focus {
    border-color: var(--accent-dark);
  }

  /* ================= BEHANCE-STYLE TYPE PILLS ================= */
  .type-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .type-pill {
    padding: 7px 18px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    user-select: none;
  }

  .type-pill:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
    background: var(--bg-subtle);
  }

  .type-pill.active {
    background: var(--accent-dark);
    color: #ffffff;
    border-color: var(--accent-dark);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
  }

  .type-pill.active svg {
    color: #ffffff;
  }

  .type-pill:active {
    transform: scale(0.96);
  }

  /* ================= PROJECTS GRID & CARDS ================= */
  .projects-canvas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 30px;
  }

  .card-item {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    animation: cardPopIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardPopIn {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card-item:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border-hover);
  }

  .card-poster {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 11;
    background: #e2e8f0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-poster img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card-item:hover .card-poster img {
    transform: scale(1.05);
  }

  /* Video Slate Backdrop */
  .video-slate {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0a0f1d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .video-slate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.2) 0%, transparent 70%);
  }

  .video-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #ffffff;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Video Play Button */
  .play-glass {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: rgba(15, 23, 42, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s ease;
  }

  .play-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ffffff;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, color 0.25s ease;
  }

  .card-item:hover .play-circle {
    transform: scale(1.14);
    background: #0f172a;
    color: #ffffff;
  }

  /* Document and Audio cover */
  .doc-art {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-muted);
    width: 100%;
    height: 100%;
    background: #f8fafc;
  }

  .doc-art svg {
    color: var(--text-secondary);
  }

  .doc-label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* Card Bottom Bar */
  .card-caption {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
  }

  .caption-text {
    min-width: 0;
    flex-grow: 1;
  }

  .card-title {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .card-subline {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-quick-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-quick-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    transition: var(--transition);
  }

  .btn-quick-icon:hover {
    color: var(--text-primary);
    background: var(--bg-subtle);
  }

  /* ================= LIGHTBOX MODAL ================= */
  .lightbox-scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .lightbox-scrim.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-stage {
    background: #ffffff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 1100px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-modal);
    position: relative;
    transform: scale(0.95) translateY(14px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }

  .lightbox-scrim.open .lightbox-stage {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .lightbox-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
  }

  .lightbox-title h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .lightbox-title p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .lightbox-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .lightbox-close:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    transform: scale(1.08);
  }

  .lightbox-canvas-wrap {
    position: relative;
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    overflow: hidden;
  }

  .lightbox-view {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    min-height: 420px;
    max-height: 66vh;
    overflow: hidden;
  }

  .lightbox-view img {
    max-width: 100%;
    max-height: 66vh;
    object-fit: contain;
  }

  .lightbox-view iframe {
    width: 100%;
    height: 66vh;
    border: none;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.3);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    z-index: 20;
    user-select: none;
    padding: 0;
  }

  .lightbox-prev {
    left: 20px;
  }

  .lightbox-next {
    right: 20px;
  }

  .lightbox-nav:hover {
    background: #1e293b;
    color: #ffffff;
    transform: translateY(-50%) scale(1.12);
    box-shadow: 0 8px 26px rgba(15, 23, 42, 0.45);
  }

  .lightbox-nav:active {
    transform: translateY(-50%) scale(0.95);
  }

  .lightbox-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-top: 1px solid var(--border-color);
    background: #ffffff;
    font-size: 0.85rem;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Skeleton Loading */
  .skeleton-block {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow: hidden;
    height: 300px;
    position: relative;
  }

  .skeleton-block::after {
