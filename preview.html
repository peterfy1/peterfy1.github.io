<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter Fayez — Motion Graphics & Video Portfolio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
  :root {
    --bg-page: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --bg-subtle: #f1f5f9;
    
    --border-color: #e2e8f0;
    --border-hover: #cbd5e1;
    
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    
    --accent-dark: #0f172a;
    --accent-blue: #2563eb;
    --accent-emerald: #10b981;
    
    --radius-xs: 6px;
    --radius-sm: 12px;
    --radius-md: 20px;
    --radius-lg: 28px;
    --radius-pill: 9999px;
    
    --shadow-card: 0 2px 8px -2px rgba(15, 23, 42, 0.06), 0 1px 4px -1px rgba(15, 23, 42, 0.04);
    --shadow-hover: 0 16px 32px -8px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
    --shadow-header: 0 10px 30px -10px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
    --shadow-modal: 0 25px 60px -15px rgba(0, 0, 0, 0.35);
    
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Consolas", Menlo, monospace;
    --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-page);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ================= PROFILE COVER BANNER ================= */
  .profile-banner {
    width: 100%;
    height: 230px;
    background-color: #ffffff;
    background-image: url('assets/cover.png');
    background-size: cover;
    background-position: center center;
    position: relative;
    border-bottom: 1px solid var(--border-color);
  }

  .profile-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.8;
  }

  .profile-banner.has-cover::after {
    display: none;
  }

  /* ================= FLOATING PROFILE CARD ================= */
  .profile-wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 32px;
    position: relative;
    z-index: 10;
  }

  .profile-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin-top: -64px;
    padding: 28px 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-header);
    gap: 28px;
    flex-wrap: wrap;
    animation: fadeUpEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUpEntrance {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .profile-identity {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  /* Squircle Avatar */
  .avatar-box {
    width: 96px;
    height: 96px;
    border-radius: 26px;
    background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
    border: 4px solid var(--bg-surface);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  .avatar-monogram {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
    user-select: none;
  }

  .profile-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .profile-title-line {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .profile-name {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    line-height: 1.2;
  }

  .badge-verified {
    color: var(--accent-blue);
    display: flex;
    align-items: center;
  }

  .badge-available {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius-pill);
    font-size: 0.74rem;
    font-weight: 700;
    color: #166534;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .dot-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6);
    animation: pulseGlow 2s infinite;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
  }

  .profile-tagline {
    font-size: 1.02rem;
    color: var(--text-secondary);
    max-width: 640px;
    line-height: 1.45;
  }

  .profile-meta-tags {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 4px;
    font-size: 0.82rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .meta-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .meta-tag svg {
    color: var(--text-muted);
  }

  /* Profile Actions */
  .profile-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 22px;
    min-height: 42px;
    border-radius: var(--radius-pill);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: var(--transition);
    border: 1px solid transparent;
    user-select: none;
    white-space: nowrap;
  }

  .btn-action:active {
    transform: scale(0.97);
  }

  .btn-action-dark {
    background: var(--accent-dark);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
  }

  .btn-action-dark:hover {
    background: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
    color: #ffffff;
  }

  .btn-action-outline {
    background: #ffffff;
    color: var(--text-primary);
    border-color: var(--border-color);
  }

  .btn-action-outline:hover {
    background: var(--bg-subtle);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
  }

  .btn-action-circle {
    width: 42px;
    height: 42px;
    min-width: 42px;
    min-height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-action-circle:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
  }

  .btn-action-circle:active {
    transform: scale(0.95);
  }

  .btn-action-circle.syncing svg {
    animation: rotateSync 1s linear infinite;
  }

  @keyframes rotateSync {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ================= GALLERY MAIN SECTION ================= */
  .gallery-container {
    max-width: 1400px;
    margin: 36px auto 80px auto;
    padding: 0 32px;
    width: 100%;
  }

  /* ================= BEHANCE-STYLE NAV TABS & TOOLS ================= */
  .gallery-nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 16px;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .nav-tabs {
    display: flex;
    align-items: center;
    gap: 26px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-tabs::-webkit-scrollbar {
    display: none;
  }

  .nav-tab-item {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 0;
    position: relative;
    transition: var(--transition);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-tab-item:hover {
    color: var(--text-primary);
  }

  .nav-tab-item.active {
    color: var(--text-primary);
  }

  .nav-tab-item.active::after {
    content: '';
    position: absolute;
    bottom: -17px;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-dark);
    border-radius: 3px;
  }

  .tab-badge {
    background: var(--bg-subtle);
    color: var(--text-muted);
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    border-radius: var(--radius-pill);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1;
    transition: var(--transition);
  }

  .nav-tab-item.active .tab-badge {
    background: #e2e8f0;
    color: var(--text-primary);
  }

  .gallery-tools {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box-wrap {
    position: relative;
    min-width: 230px;
  }

  .search-box-wrap input {
    width: 100%;
    padding: 8px 14px 8px 36px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-primary);
    font-size: 0.84rem;
    outline: none;
    transition: var(--transition);
  }

  .search-box-wrap input:focus {
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
  }

  .search-ico {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
  }

  .sort-picker {
    padding: 8px 16px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    font-size: 0.84rem;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    transition: var(--transition);
  }

  .sort-picker:focus {
    border-color: var(--accent-dark);
  }

  /* ================= BEHANCE-STYLE TYPE PILLS ================= */
  .type-filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .type-pill {
    padding: 7px 18px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    user-select: none;
  }

  .type-pill:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
    background: var(--bg-subtle);
  }

  .type-pill.active {
    background: var(--accent-dark);
    color: #ffffff;
    border-color: var(--accent-dark);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
  }

  .type-pill.active svg {
    color: #ffffff;
  }

  .type-pill:active {
    transform: scale(0.96);
  }

  /* ================= PROJECTS GRID & CARDS ================= */
  .projects-canvas {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 30px;
  }

  .card-item {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    animation: cardPopIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardPopIn {
    from {
      opacity: 0;
      transform: translateY(20px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .card-item:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border-hover);
  }

  .card-poster {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 11;
    background: #e2e8f0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-poster img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card-item:hover .card-poster img {
    transform: scale(1.05);
  }

  /* Video Slate Backdrop */
  .video-slate {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0a0f1d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .video-slate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.2) 0%, transparent 70%);
  }

  .video-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #ffffff;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(255, 255, 255, 0.15);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Video Play Button */
  .play-glass {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: rgba(15, 23, 42, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s ease;
  }

  .play-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ffffff;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease, color 0.25s ease;
  }

  .card-item:hover .play-circle {
    transform: scale(1.14);
    background: #0f172a;
    color: #ffffff;
  }

  /* Document and Audio cover */
  .doc-art {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-muted);
    width: 100%;
    height: 100%;
    background: #f8fafc;
  }

  .doc-art svg {
    color: var(--text-secondary);
  }

  .doc-label {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* Card Bottom Bar */
  .card-caption {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
  }

  .caption-text {
    min-width: 0;
    flex-grow: 1;
  }

  .card-title {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .card-subline {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-quick-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn-quick-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    text-decoration: none;
    transition: var(--transition);
  }

  .btn-quick-icon:hover {
    color: var(--text-primary);
    background: var(--bg-subtle);
  }

  /* ================= LIGHTBOX MODAL ================= */
  .lightbox-scrim {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .lightbox-scrim.open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-stage {
    background: #ffffff;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 1100px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-modal);
    position: relative;
    transform: scale(0.95) translateY(14px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }

  .lightbox-scrim.open .lightbox-stage {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .lightbox-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-color);
  }

  .lightbox-title h3 {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .lightbox-title p {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .lightbox-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .lightbox-close:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
    transform: scale(1.08);
  }

  .lightbox-canvas-wrap {
    position: relative;
    width: 100%;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    overflow: hidden;
  }

  .lightbox-view {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    min-height: 420px;
    max-height: 66vh;
    overflow: hidden;
  }

  .lightbox-view img {
    max-width: 100%;
    max-height: 66vh;
    object-fit: contain;
  }

  .lightbox-view iframe {
    width: 100%;
    height: 66vh;
    border: none;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.3);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    z-index: 20;
    user-select: none;
    padding: 0;
  }

  .lightbox-prev {
    left: 20px;
  }

  .lightbox-next {
    right: 20px;
  }

  .lightbox-nav:hover {
    background: #1e293b;
    color: #ffffff;
    transform: translateY(-50%) scale(1.12);
    box-shadow: 0 8px 26px rgba(15, 23, 42, 0.45);
  }

  .lightbox-nav:active {
    transform: translateY(-50%) scale(0.95);
  }

  .lightbox-footer {
    display: flex;
    align-items: center;

    border-top: 1px solid var(--border-color);
    background: #ffffff;
    font-size: 0.85rem;
    flex-wrap: wrap;
    gap: 12px;
  }

  /* Skeleton Loading */
  .skeleton-block {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow: hidden;
    height: 300px;
    position: relative;
  }

  .skeleton-block::after {
    content: '';
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background-image: linear-gradient(
      90deg,
      rgba(241, 245, 249, 0) 0,
      rgba(241, 245, 249, 0.8) 50%,
      rgba(241, 245, 249, 0) 100%
    );
    animation: shimmer 1.6s infinite;
  }

  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }

  .gallery-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .gallery-empty svg {
    margin-bottom: 12px;
  }

  /* Toast Notification */
  .toast-banner {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0f172a;
    color: #ffffff;
    padding: 12px 22px;
    border-radius: var(--radius-full);
    box-shadow: var(--shadow-hover);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: var(--transition);
    font-size: 0.86rem;
    font-weight: 500;
  }

  .toast-banner.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* ================= RESPONSIVE DESIGN ================= */
  @media (max-width: 960px) {
    .profile-card {
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }
    .profile-buttons {
      width: 100%;
      justify-content: flex-start;
    }
  }

  @media (max-width: 768px) {
    .profile-wrapper, .gallery-container {
      padding: 0 16px;
    }
    .profile-card {
      padding: 22px;
      margin-top: -48px;
    }
    .profile-name {
      font-size: 1.55rem;
    }
    .projects-canvas {
      grid-template-columns: 1fr;
    }
    .gallery-nav-bar {

    }
    .gallery-tools {
      width: 100%;

  }

  @media (max-width: 580px) {

</style>

  <script>
  // State management
  let portfolioData = null;
  let activeCategory = 'All';
  let activeType = 'all';
  let searchQuery = '';
  let activeSort = 'newest';
  let currentModalIndex = -1;
  let filteredItems = [];
  let isPolling = false;

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', () => {
    // Always force fresh fetch on initial page load / browser refresh
    loadPortfolioData(true);

    // Auto-check for updates every 15 seconds
    setInterval(() => {
      autoCheckForUpdates();
    }, 15000);

    // Auto-check immediately when tab gains focus (e.g. user switches back from Google Drive)
    window.addEventListener('focus', () => {
      autoCheckForUpdates();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        autoCheckForUpdates();
      }
    });
  });

  /**
   * Fetch portfolio data
   */
  function loadPortfolioData(forceRefresh = true) {
    const syncBtn = document.getElementById('syncBtn');
    if (syncBtn) syncBtn.classList.add('syncing');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((data) => {
          if (syncBtn) syncBtn.classList.remove('syncing');
          handleDataLoaded(data, forceRefresh);
        })
        .withFailureHandler((error) => {
          if (syncBtn) syncBtn.classList.remove('syncing');
          handleDataError(error);
        })
        .getPortfolioData(forceRefresh);
    } else {
      // Remote fetch via Apps Script JSON API (for GitHub Pages & local preview)
      const apiUrl = 'https://script.google.com/macros/s/AKfycbypIpX-alQX3JfE0XMabmLF27nezSrlHmw_ekdh7Gso3cnKvJSAA9iVBXruFkkUJQ/exec?format=json' + (forceRefresh ? '&refresh=true' : '');
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          if (syncBtn) syncBtn.classList.remove('syncing');
          handleDataLoaded(data, forceRefresh);
        })
        .catch(err => {
          if (syncBtn) syncBtn.classList.remove('syncing');
          handleDataError(err);
        });
    }
  }

  /**
   * Background silent polling for newly added, renamed, or deleted assets
   */
  function autoCheckForUpdates() {
    if (isPolling) return;
    isPolling = true;

    const onFreshData = (freshData) => {
      isPolling = false;
      if (freshData && freshData.success) {
        if (!portfolioData) {
          handleDataLoaded(freshData, false);
          return;
        }

        const dataChanged = JSON.stringify(portfolioData.items) !== JSON.stringify(freshData.items) ||
                            JSON.stringify(portfolioData.categories) !== JSON.stringify(freshData.categories) ||
                            portfolioData.title !== freshData.title ||
                            portfolioData.bio !== freshData.bio ||
                            portfolioData.avatarUrl !== freshData.avatarUrl ||
                            portfolioData.coverUrl !== freshData.coverUrl;

        if (dataChanged) {
          const oldCount = (portfolioData.items || []).length;
          const newCount = (freshData.items || []).length;
          portfolioData = freshData;
          renderProfileHeader(freshData);
          renderCategoryTabs(freshData.categories || ['All']);
          renderPortfolio();

          if (newCount > oldCount) {
            showToast(`${newCount - oldCount} new work item(s) synced`);
          } else {
            showToast('Portfolio synced with Drive');
          }
        }
      }
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onFreshData)
        .withFailureHandler(() => { isPolling = false; })
        .getPortfolioData(false);
    } else {
      fetch('https://script.google.com/macros/s/AKfycbypIpX-alQX3JfE0XMabmLF27nezSrlHmw_ekdh7Gso3cnKvJSAA9iVBXruFkkUJQ/exec?format=json')
        .then(res => res.json())
        .then(onFreshData)
        .catch(() => { isPolling = false; });
    }
  }

  /**
   * Handles successfully loaded data
   */
  function handleDataLoaded(data, wasManualRefresh) {
    if (!data || !data.success) {
      renderErrorState(data ? data.message : 'Unable to load portfolio assets.');
      return;
    }

    portfolioData = data;
    renderProfileHeader(data);
    renderCategoryTabs(data.categories || ['All']);
    renderPortfolio();

    if (wasManualRefresh) {
      showToast('Portfolio updated');
    }
  }

  function handleDataError(error) {
    console.error('Error loading portfolio:', error);
    renderErrorState('Unable to load portfolio assets. Please try again.');
  }

  function isGenericTitle(str) {
    if (!str) return true;
    const s = str.trim().toLowerCase();
    return s === 'portfolio' || s === 'portofolio' || s === 'cv' || s === 'my portfolio' || s === 'drive' || s === 'files' || s === 'projects' || s === 'google drive';
  }

  /**
   * Render Profile Header
   */
  function renderProfileHeader(data) {
    // Title / Name: Always ensure Peter Fayez is the author name unless a distinct personal name is provided
    const nameEl = document.getElementById('profileName');
    let authorName = 'Peter Fayez';
    if (data.author && !isGenericTitle(data.author)) {
      authorName = data.author;
    } else if (data.title && !isGenericTitle(data.title)) {
      authorName = data.title;
    }

    if (nameEl) {
      nameEl.textContent = authorName;
    }

    // Headline / Bio
    const headlineEl = document.getElementById('profileHeadline');
    if (headlineEl) {
      headlineEl.textContent = data.bio || data.description || 'Motion Graphics Designer & Video Editor | Software Engineering Student';
    }

    // Cover Image (if uploaded or default)
    const bannerEl = document.getElementById('profileBanner');
    if (bannerEl) {
      const cover = data.coverUrl || 'assets/cover.png';
      bannerEl.style.backgroundImage = `url('${cover}')`;
      bannerEl.classList.add('has-cover');
    }

    // Avatar (if avatar image exists or fallback to assets/avatar.png)
    const avatarBox = document.getElementById('avatarBox');
    if (avatarBox) {
      const avatarSrc = data.avatarUrl || 'assets/avatar.png';
      const initials = getInitials(authorName);
      avatarBox.innerHTML = `<img src="${avatarSrc}" class="avatar-img" alt="${escapeHtml(authorName)}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'avatar-monogram\\'>${initials}</span>';" />`;
    }

    // Total Projects
    const totalEl = document.getElementById('metaProjectsCount');
    if (totalEl) {
      const count = (data.items || []).length;
      totalEl.textContent = `${count} ${count === 1 ? 'Project' : 'Projects'}`;
    }

    // Contact Email if bio contains email
    const contactBtn = document.getElementById('contactBtn');
    if (contactBtn && data.bio) {
      const emailMatch = data.bio.match(/([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/);
      if (emailMatch) {
        contactBtn.href = 'mailto:' + emailMatch[0];
      }
    }
  }

  /**
   * Extract Initials from Name
   */
  function getInitials(name) {
    if (!name || isGenericTitle(name)) return 'PF';
    const parts = name.trim().split(/\s+/);
    if (parts.length >= 2) {
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }
    return name.substring(0, 2).toUpperCase();
  }

  /**
   * Render Behance-Style Category Tabs
   */
  function renderCategoryTabs(categories) {
    const container = document.getElementById('navTabs') || document.getElementById('categoryRail');
    if (!container) return;

    container.innerHTML = '';
    categories.forEach((cat) => {
      const btn = document.createElement('button');
      btn.className = `nav-tab-item ${activeCategory === cat ? 'active' : ''}`;
      
      const count = cat === 'All' 
        ? (portfolioData.items || []).length 
        : (portfolioData.items || []).filter(i => i.category === cat).length;

      const label = cat === 'All' ? 'All Works' : cat;

      btn.innerHTML = `
        <span>${escapeHtml(label)}</span>
        <span class="tab-badge">${count}</span>
      `;

      btn.onclick = () => {
        activeCategory = cat;
        renderCategoryTabs(categories);
        renderPortfolio();
      };

      container.appendChild(btn);
    });
  }

  /**
   * Set asset media type filter
   */
  function setTypeFilter(type, el) {
    activeType = type;
    document.querySelectorAll('.type-pill, .type-segment-btn, .type-chip').forEach(btn => btn.classList.remove('active'));
    if (el) el.classList.add('active');
    renderPortfolio();
  }

  /**
   * Search input listener
   */
  function handleSearch(query) {
    searchQuery = query.toLowerCase().trim();
    renderPortfolio();
  }

  /**
   * Sort selector listener
   */
  function handleSort(sortBy) {
    activeSort = sortBy;
    renderPortfolio();
  }

  /**
   * Render the portfolio item cards
   */
  function renderPortfolio() {
    const grid = document.getElementById('projectsCanvas');
    if (!grid || !portfolioData) return;

    let items = [...(portfolioData.items || [])];

    // 1. Filter by Category
    if (activeCategory !== 'All') {
      items = items.filter(item => item.category === activeCategory);
    }

    // 2. Filter by Type
    if (activeType !== 'all') {
      items = items.filter(item => item.type === activeType);
    }

    // 3. Search query
    if (searchQuery) {
      items = items.filter(item => 
        (item.name && item.name.toLowerCase().includes(searchQuery)) ||
        (item.rawName && item.rawName.toLowerCase().includes(searchQuery)) ||
        (item.category && item.category.toLowerCase().includes(searchQuery))
      );
    }

    // 4. Sorting
    items.sort((a, b) => {
      if (activeSort === 'newest') {
        return new Date(b.lastUpdated).getTime() - new Date(a.lastUpdated).getTime();
      } else if (activeSort === 'oldest') {
        return new Date(a.lastUpdated).getTime() - new Date(b.lastUpdated).getTime();
      } else if (activeSort === 'name') {
        return a.name.localeCompare(b.name);
      } else if (activeSort === 'size') {
        return (b.sizeBytes || 0) - (a.sizeBytes || 0);
      }
      return 0;
    });

    filteredItems = items;

    if (items.length === 0) {
      const isFiltered = activeCategory !== 'All' || activeType !== 'all' || searchQuery.trim() !== '';
      grid.innerHTML = `
        <div class="gallery-empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <h4 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 6px;">${isFiltered ? 'No projects found' : 'No assets uploaded yet'}</h4>
          <p style="font-size: 0.9rem;">${isFiltered ? 'Try selecting another category or adjusting your search term.' : 'Drop your motion graphics reels, video edits, designs, or PDFs into your folder to showcase them here.'}</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = items.map((item, index) => renderCardHtml(item, index)).join('');
  }

  /**
   * Generates Card HTML
   */
  function renderCardHtml(item, index) {
    let posterHtml = '';

    if (item.type === 'image') {
      posterHtml = `
        <img 
          src="${item.thumbnailUrl}" 
          alt="${escapeHtml(item.name)}" 
          loading="lazy"
          onerror="this.onerror=null; this.src='${item.cdnUrl}'"
        />
      `;
    } else if (item.type === 'video') {
      const posterImg = item.posterUrl || item.thumbnailUrl;
      posterHtml = `
        <div class="video-slate">
          <div class="video-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            <span>${escapeHtml(item.category)}</span>
          </div>
        </div>
        <img 
          src="${posterImg}" 
          alt="${escapeHtml(item.name)}" 
          loading="lazy" 
          onerror="this.onerror=null; this.src='${item.cdnUrl}'; this.onerror=() => { this.style.opacity='0'; };"
        />
        <div class="play-glass">
          <div class="play-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
          </div>
        </div>
      `;
    } else {
      let iconSvg = `
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
      `;
      if (item.type === 'audio') {
        iconSvg = `
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        `;
      }

      posterHtml = `
        <div class="doc-art">
          ${iconSvg}
          <span class="doc-label">${escapeHtml(item.mimeType.split('/')[1] || item.type)}</span>
        </div>
      `;
    }

    const delay = Math.min(index * 0.04, 0.32).toFixed(2);
    const hasRealSize = item.sizeBytes && item.sizeBytes > 0 && item.sizeFormatted && item.sizeFormatted !== '0 B';
    const sizeBadge = hasRealSize ? item.sizeFormatted : (item.type === 'video' ? 'HD Video' : '');
    const sublineText = sizeBadge ? `${escapeHtml(item.category)} • ${sizeBadge}` : escapeHtml(item.category);

    return `
      <div class="card-item" onclick="openModal(${index})" style="animation-delay: ${delay}s;">
        <div class="card-poster">
          ${posterHtml}
        </div>
        <div class="card-caption">
          <div class="caption-text">
            <div class="card-title" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
            <div class="card-subline">${sublineText}</div>
          </div>
          <div class="card-quick-actions" onclick="event.stopPropagation()">
            <a href="${item.downloadUrl}" target="_blank" class="btn-quick-icon" title="Download Asset">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </a>
          </div>
        </div>
      </div>
    `;
  }

  /**
   * Modal Lightbox
   */
  function openModal(index) {
    if (index < 0 || index >= filteredItems.length) return;
    currentModalIndex = index;
    const item = filteredItems[index];

    const scrim = document.getElementById('lightboxScrim');
    const modalTitle = document.getElementById('modalTitle');
    const modalMeta = document.getElementById('modalMeta');
    const lightboxView = document.getElementById('lightboxView');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');

    modalTitle.textContent = item.name;
    const hasRealSize = item.sizeBytes && item.sizeBytes > 0 && item.sizeFormatted && item.sizeFormatted !== '0 B';
    const sizeMeta = hasRealSize ? ` • ${item.sizeFormatted}` : (item.type === 'video' ? ' • Video Stream' : '');
    modalMeta.textContent = `${item.category}${sizeMeta} • ${new Date(item.lastUpdated).toLocaleDateString()}`;
    
    modalDownloadBtn.href = item.downloadUrl;

    if (item.type === 'image') {
      lightboxView.innerHTML = `
        <img src="${item.cdnUrl}" onerror="this.src='${item.thumbnailUrl}'" alt="${escapeHtml(item.name)}" />
      `;
    } else if (item.type === 'video' || item.type === 'document') {
      lightboxView.innerHTML = `
        <iframe src="${item.previewUrl}" allow="autoplay" allowfullscreen></iframe>
      `;
    } else if (item.type === 'audio') {
      lightboxView.innerHTML = `
        <div style="padding: 40px; text-align: center;">
          <audio controls autoplay style="width: 100%; max-width: 480px;">
            <source src="${item.downloadUrl}" type="${item.mimeType}">
            Your browser does not support audio playback.
          </audio>
        </div>
      `;
    } else {
      lightboxView.innerHTML = `
        <div style="padding: 50px; text-align: center; color: var(--text-primary);">
          <h3 style="margin-bottom: 12px;">${escapeHtml(item.rawName)}</h3>
          <a href="${item.downloadUrl}" target="_blank" class="btn-action btn-action-dark" style="background: #2563eb; color: #fff;">Download File</a>
        </div>
      `;
    }

    scrim.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    const scrim = document.getElementById('lightboxScrim');
    scrim.classList.remove('open');
    document.body.style.overflow = 'auto';

    const lightboxView = document.getElementById('lightboxView');
    if (lightboxView) lightboxView.innerHTML = '';
  }

  function prevModal() {
    if (currentModalIndex > 0) {
      openModal(currentModalIndex - 1);
    } else {
      openModal(filteredItems.length - 1);
    }
  }

  function nextModal() {
    if (currentModalIndex < filteredItems.length - 1) {
      openModal(currentModalIndex + 1);
    } else {
      openModal(0);
    }
  }

  // Keyboard controls
  document.addEventListener('keydown', (e) => {
    const scrim = document.getElementById('lightboxScrim');
    if (!scrim.classList.contains('open')) return;

    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') prevModal();
    if (e.key === 'ArrowRight') nextModal();
  });

  /**
   * Share / Copy Link
   */
  function copyPortfolioLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
      showToast('Portfolio link copied to clipboard');
    }).catch(() => {
      showToast('Link ready to share');
    });
  }

  function showToast(message) {
    const toast = document.getElementById('toastBanner');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
    }, 3200);
  }

  function renderErrorState(message) {
    const grid = document.getElementById('projectsCanvas');
    if (grid) {
      grid.innerHTML = `
        <div class="gallery-empty" style="border: 1px dashed var(--border-color); border-radius: 12px; background: #ffffff; padding: 40px 20px;">
          <h4 style="color: #dc2626; margin-bottom: 8px;">Unable to load portfolio</h4>
          <p style="max-width: 500px; margin: 0 auto; font-size: 0.9rem;">${escapeHtml(message)}</p>
        </div>
      `;
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
